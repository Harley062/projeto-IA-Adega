[theme]
# Tema Escuro para a Adega
base = "dark"
primaryColor = "#B8424C"  # Tom mais suave de vinho para tema escuro
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
